[project]
name = "omr-transformer"
version = "0.1.0"
description = "End-to-end optical music recognition: staff image -> music tokens -> MusicXML/MIDI, with a CNN + Transformer encoder-decoder in PyTorch."
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "numpy>=1.24", "pillow>=10.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
